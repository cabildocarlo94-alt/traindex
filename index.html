<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRAINDEX – MRT-3 Train Monitoring</title>
<style>
:root{--nv:#0f2a5a;--nv2:#17386f;--bl:#1a6ff0;--bg:#e9eef6;--pn:#fff;--tx:#14213d;--ln:#b9c7e0;--alt:#eef3fb;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--pn:#141e33;--tx:#e6ecf8;--ln:#2c3d63;--alt:#18243e;--in:#0f1a2e}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select{font:inherit}
header{background:var(--nv);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
.logo{font-size:26px;font-weight:800;letter-spacing:2px}.sub{font-size:11px;opacity:.8;max-width:260px}
.sp{flex:1}.on{color:#3ddc97}
.um{display:flex;align-items:center;gap:8px}.av{width:34px;height:34px;border-radius:50%;background:#5b7fc0;display:grid;place-items:center;font-weight:700}
.btn{background:var(--bl);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer}.btn.g{background:transparent;border:1px solid currentColor}.btn.r{background:#c8334f}.btn.s{padding:3px 8px;font-size:12px}
.wrap{display:flex;min-height:calc(100vh - 60px)}
nav{background:var(--nv);width:190px;padding:12px 8px;flex-shrink:0}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:10px 12px;border-radius:6px;cursor:pointer;margin-bottom:4px}
nav button.a{background:var(--bl)}nav hr{border:0;border-top:1px solid #ffffff33;margin:10px 0}
main{flex:1;padding:12px;min-width:0}
.top{background:var(--pn);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top h2{margin:0;font-size:20px}.top small{opacity:.7}
.cards{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.card{color:#fff;border-radius:8px;padding:6px 14px;min-width:96px}.card b{font-size:26px;display:block;line-height:1}.card span{font-size:11px}
.card.e{cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.grid{grid-template-columns:1fr}nav{width:100%;display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto;margin:0}nav hr{display:none}.wrap{flex-direction:column}}
.pn{background:var(--pn);border:1px solid var(--ln);margin-bottom:12px}
.pn h3{margin:0;background:var(--nv2);color:#fff;font-size:12px;letter-spacing:.5px;padding:7px 10px;display:flex;align-items:center;justify-content:space-between}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;padding:6px 8px;border-bottom:2px solid var(--nv2)}
td{padding:5px 8px;border-bottom:1px solid var(--ln);height:28px;border-right:1px solid var(--ln)}tr:nth-child(even) td{background:var(--alt)}
.chip{display:inline-block;background:var(--bl);color:#fff;border-radius:6px;padding:2px 10px;margin:1px 3px 1px 0;font-size:12px}
.pill{border-radius:6px;padding:2px 10px;font-size:12px;font-weight:600;display:inline-block}
.p-Under{background:#f7c948;color:#222}.p-Insp{background:#8fc2ff;color:#10305e}.p-Done{background:#8de0ae;color:#0b4a28}
.pad{padding:10px}.muted{opacity:.6}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:9;padding:16px}
.box{background:var(--pn);border-radius:10px;padding:18px;width:min(420px,100%);max-height:90vh;overflow:auto}
.box h3{margin:0 0 12px}label{display:block;font-size:12px;margin:8px 0 3px}
input,select{width:100%;padding:7px 9px;border:1px solid var(--ln);border-radius:6px;background:var(--in);color:var(--tx)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.err{color:#d6334f;margin-top:8px;min-height:18px}

function due(m){const x=/(\d+)\s*(YEAR|MONTH|DAY)/i.exec(m.work||'');if(!x||!m.date)return null;const d=new Date(m.date),n=+x[1],t=x[2].toUpperCase();if(t=='YEAR')d.setFullYear(d.getFullYear()+n);else if(t=='MONTH')d.setMonth(d.getMonth()+n);else d.setDate(d.getDate()+n);return d}

function roster(){return[...new Set([...(S.extra||[]),...S.trains.flatMap(t=>t.comp),...S.spares,...S.repairs.map(r=>r.car),...S.maint.map(m=>m.car),...S.hist.map(h=>h.car)])].sort()}

const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';

function pSet(){return`<div class="pn"><h3>SETTINGS</h3><div class="pad"><p>Signed in as <b>${esc(U.n)}</b> (${ROLES[U.role]}${U.section?' – '+SECS[U.section]:''})</p><button class="btn" data-a="cp">Change My Password</button></div></div><div class="pn"><h3>TWO-FACTOR AUTHENTICATION</h3><div class="pad"><p>Status: <b>${U.totp?'Enabled':'Not enabled'}</b>${U.totp?` · ${(U.bk||[]).length} backup codes left`:''}</p>${U.totp?`<button class="btn" data-a="nb">New backup codes</button> ${(S.req||[]).includes(U.role)?'':'<button class="btn r" data-a="d2">Turn off</button>'}`:'<button class="btn" data-a="e2">Enable 2FA</button>'}</div></div>${U.role=='it_admin'?`<div class="pn"><h3>REQUIRE 2FA FOR</h3><div class="pad">${Object.entries(ROLES).map(([k,v])=>`<label style="display:inline-block;margin-right:14px"><input type="checkbox" style="width:auto" data-req="${k}" ${(S.req||[]).includes(k)?'checked':''}> ${v}</label>`).join('')}<p class="muted" style="font-size:12px">People in these roles must set up 2FA at their next login.</p></div></div>`:''}${U.role=='it_admin'?`<div class="pn"><h3>BACKUP &amp; RESTORE</h3><div class="pad"><p>Export all data to a file, or restore from a backup file.</p><button class="btn" data-a="bx">Export backup</button> <label class="btn" style="display:inline-block;cursor:pointer">Import backup<input type="file" id="bi" accept=".json" hidden></label></div></div>`:''}`}
